<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Jarvis's Workshop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap');
        
        :root {
            --bg-primary: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0f2847 100%);
            --bg-widget: rgba(255,255,255,0.05);
            --bg-widget-hover: rgba(255,255,255,0.08);
            --text-primary: #fff;
            --text-secondary: #888;
            --text-accent: #00d9ff;
            --accent-green: #00ff88;
            --accent-yellow: #ffd93d;
            --accent-red: #ff6b6b;
            --accent-purple: #a855f7;
            --border-color: rgba(255,255,255,0.1);
            --card-bg: rgba(255,255,255,0.05);
            --input-bg: rgba(255,255,255,0.1);
            --shadow: rgba(0,0,0,0.3);
        }
        
        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #cbd5e1 100%);
            --bg-widget: rgba(255,255,255,0.85);
            --bg-widget-hover: rgba(255,255,255,0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #64748b;
            --text-accent: #0284c7;
            --accent-green: #059669;
            --accent-yellow: #ca8a04;
            --accent-red: #dc2626;
            --accent-purple: #7c3aed;
            --border-color: rgba(0,0,0,0.1);
            --card-bg: rgba(255,255,255,0.9);
            --input-bg: rgba(255,255,255,0.9);
            --shadow: rgba(0,0,0,0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: background 0.5s, color 0.3s;
            overflow-x: hidden;
        }
        
        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.3;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Hero Title */
        .hero {
            text-align: center;
            padding: 40px 0;
            position: relative;
        }
        
        .hero-subtitle {
            font-size: 1.2em;
            color: var(--accent-purple);
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease-out;
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5em;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--text-accent), var(--accent-green), var(--accent-purple), var(--text-accent));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 5s ease infinite, fadeInUp 1s ease-out;
            text-shadow: 0 0 50px rgba(0,217,255,0.3);
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .typing-text {
            font-size: 1.5em;
            color: var(--accent-green);
            margin-top: 15px;
            min-height: 40px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }
        
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: var(--accent-green);
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .hero-status {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-widget);
            border-radius: 20px;
            font-size: 0.9em;
            border: 1px solid var(--border-color);
            animation: fadeInUp 1s ease-out;
        }
        
        .status-badge:nth-child(1) { animation-delay: 0.2s; }
        .status-badge:nth-child(2) { animation-delay: 0.4s; }
        .status-badge:nth-child(3) { animation-delay: 0.6s; }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0,255,136,0); }
        }
        
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .theme-btn {
            background: var(--bg-widget);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .theme-btn:hover {
            background: var(--bg-widget-hover);
            transform: scale(1.1);
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .widget {
            background: var(--bg-widget);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .widget::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--text-accent), var(--accent-green));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .widget:hover::before {
            opacity: 1;
        }
        
        .widget:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px var(--shadow);
        }
        
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .widget-title {
            font-size: 1.3em;
            color: var(--text-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .widget-icon {
            font-size: 1.5em;
        }
        
        .widget-btn {
            background: rgba(0,217,255,0.2);
            border: none;
            color: var(--text-accent);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .widget-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0,217,255,0.3);
        }
        
        .clock-display {
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 4em;
            font-weight: 700;
            color: var(--accent-green);
            text-shadow: 0 0 30px var(--accent-green);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px var(--accent-green); }
            to { text-shadow: 0 0 40px var(--accent-green), 0 0 60px var(--accent-green); }
        }
        
        .clock-date {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2em;
            margin-top: 10px;
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .weather-main {
            text-align: center;
            padding: 20px;
            background: rgba(255,217,61,0.1);
            border-radius: 15px;
            transition: all 0.3s;
        }
        
        .weather-icon {
            font-size: 4em;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }
        
        .weather-main:hover .weather-icon {
            transform: scale(1.2) rotate(10deg);
        }
        
        .weather-temp {
            font-family: 'Orbitron', sans-serif;
            font-size: 3em;
            color: var(--accent-yellow);
            font-weight: 700;
        }
        
        .weather-city {
            color: var(--text-secondary);
            font-size: 1.1em;
            margin-top: 5px;
        }
        
        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }
        
        .weather-detail {
            background: rgba(0,217,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .weather-detail:hover {
            transform: scale(1.05);
        }
        
        .weather-detail-value {
            font-size: 1.5em;
            color: var(--text-accent);
            font-weight: 700;
        }
        
        .weather-detail-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .news-section {
            grid-column: span 2;
        }
        
        .news-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .news-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .news-tab.active {
            background: linear-gradient(135deg, var(--text-accent), var(--accent-purple));
            color: #fff;
            box-shadow: 0 0 15px rgba(0,217,255,0.3);
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .news-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .news-card:hover::after {
            left: 100%;
        }
        
        .news-card:hover {
            background: var(--bg-widget-hover);
            border-color: var(--text-accent);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px var(--shadow);
        }
        
        .news-card-title {
            font-size: 0.95em;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .news-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .news-card-source {
            font-size: 0.75em;
            color: var(--text-accent);
            font-weight: 700;
        }
        
        .news-card-time {
            font-size: 0.75em;
            color: var(--text-secondary);
        }
        
        .news-card-link {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(0,217,255,0.2);
            border-radius: 6px;
            font-size: 0.8em;
            color: var(--text-accent);
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .news-card:hover .news-card-link {
            background: rgba(0,217,255,0.4);
            transform: scale(1.05);
        }
        
        .news-refresh-btn {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(135deg, var(--text-accent), var(--accent-green));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .news-refresh-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0,217,255,0.4);
        }
        
        .news-refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .news-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            grid-column: span 3;
        }
        
        .todo-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .todo-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .todo-input:focus {
            outline: none;
            border-color: var(--text-accent);
            box-shadow: 0 0 15px rgba(0,217,255,0.2);
        }
        
        .todo-input::placeholder {
            color: var(--text-secondary);
        }
        
        .todo-add-btn {
            background: linear-gradient(135deg, var(--accent-green), #00cc6a);
            border: none;
            color: #1a1a2e;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .todo-add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }
        
        .todo-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
            transition: all 0.3s;
        }
        
        .todo-item:hover {
            background: var(--bg-widget-hover);
        }
        
        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-green);
        }
        
        .todo-text {
            flex: 1;
            color: var(--text-primary);
        }
        
        .todo-text.done {
            text-decoration: line-through;
            color: var(--text-secondary);
        }
        
        .todo-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 1.2em;
            opacity: 0.5;
            transition: all 0.3s;
        }
        
        .todo-delete:hover {
            opacity: 1;
            transform: scale(1.2);
        }
        
        .search-area {
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--text-accent);
            box-shadow: 0 0 20px rgba(0,217,255,0.3);
        }
        
        .search-btn {
            background: linear-gradient(135deg, var(--text-accent), var(--accent-purple));
            border: none;
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(0,217,255,0.4);
        }
        
        .counter-section {
            text-align: center;
        }
        
        .big-counter {
            font-family: 'Orbitron', sans-serif;
            font-size: 5em;
            font-weight: 900;
            color: var(--accent-red);
            text-shadow: 0 0 30px var(--accent-red);
        }
        
        .counter-controls {
            margin-top: 20px;
        }
        
        .counter-btn {
            background: rgba(255,107,107,0.2);
            border: none;
            color: var(--accent-red);
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        
        .counter-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,107,107,0.4);
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: var(--bg-widget);
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            color: var(--accent-green);
            font-weight: 700;
        }
        
        .status-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .weather-grid {
                grid-template-columns: 1fr;
            }
            .news-section {
                grid-column: span 1;
            }
            .news-grid {
                grid-template-columns: 1fr;
            }
            .news-loading {
                grid-column: span 1;
            }
            .header {
                flex-direction: column;
                gap: 15px;
            }
            h1 {
                font-size: 2em;
            }
            .hero-status {
                gap: 10px;
            }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--text-accent);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="hero">
            <p class="hero-subtitle">⚡ Powered by Jarvis AI</p>
            <h1>Welcome to Jarvis's Workshop</h1>
            <div class="typing-text">
                <span id="typing"></span><span class="cursor"></span>
            </div>
            <div class="hero-status">
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span>System Online</span>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span>MiniMax M2.7</span>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span>OpenClaw Ready</span>
                </div>
            </div>
        </div>
        
        <div class="header">
            <div></div>
            <div class="theme-toggle">
                <button class="theme-btn" onclick="setTheme('dark')" title="深色模式">🌙</button>
                <button class="theme-btn" onclick="setTheme('light')" title="浅色模式">☀️</button>
            </div>
        </div>
        
        <div class="search-area">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="✨ 搜索任何内容..." onkeypress="if(event.key==='Enter') openSearch()">
                <button class="search-btn" onclick="openSearch()">🔍</button>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">🕐</span> 时钟</span>
                </div>
                <div class="clock-display" id="clock">00:00:00</div>
                <div class="clock-date" id="date">2026年3月19日 星期四</div>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">🌤️</span> 天气</span>
                    <button class="widget-btn" onclick="refreshWeather()">刷新</button>
                </div>
                <div class="weather-grid">
                    <div class="weather-main">
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-temp" id="weatherTemp">7°C</div>
                        <div class="weather-city">Saskatoon</div>
                    </div>
                    <div class="weather-info">
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherHumidity">--</div>
                            <div class="weather-detail-label">湿度</div>
                        </div>
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherWind">--</div>
                            <div class="weather-detail-label">风速</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="widget news-section">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">📰</span> 最新新闻</span>
                    <div>
                        <button class="widget-btn" onclick="switchNewsTab('world')">世界</button>
                        <button class="widget-btn" onclick="switchNewsTab('china')">中国</button>

    <script>
        // ===== Particles Background =====
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.width = (Math.random() * 4 + 2) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }
        createParticles();
        
        // ===== Typing Effect =====
        const phrases = [
            "Hello, I'm Jarvis!",
            "Your personal AI assistant",
            "How can I help you today?",
            "Ready to assist 24/7",
            "Let's build something amazing!",
            "Welcome to my workshop!"
        ];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        
        function typeEffect() {
            const typingEl = document.getElementById('typing');
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                typingEl.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typingEl.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }
            
            let typeSpeed = isDeleting ? 50 : 100;
            
            if (!isDeleting && charIndex === currentPhrase.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                typeSpeed = 500;
            }
            
            setTimeout(typeEffect, typeSpeed);
        }
        typeEffect();
        
        // ===== Theme =====
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('jarvisTheme', theme);
        }
        
        function loadTheme() {
            const savedTheme = localStorage.getItem('jarvisTheme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
        }
        loadTheme();
        
        // ===== Clock =====
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', {hour12: false});
            document.getElementById('clock').textContent = time;
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('zh-CN', options);
            document.getElementById('date').textContent = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // ===== Weather =====
        async function fetchWeather() {
            try {
                const response = await fetch('https://wttr.in/Saskatoon?format=j1');
                const data = await response.json();
                const current = data.current_condition[0];
                
                document.getElementById('weatherTemp').textContent = current.temp_C + '°C';
                document.getElementById('weatherHumidity').textContent = current.humidity + '%';
                document.getElementById('weatherWind').textContent = current.windspeedKmph + ' km/h';
                
                const weatherCode = current.weatherCode;
                let icon = '☀️';
                if (weatherCode.includes('119') || weatherCode.includes('122')) icon = '☁️';
                else if (weatherCode.includes('143') || weatherCode.includes('248')) icon = '🌫️';
                else if (weatherCode.includes('176') || weatherCode.includes('263') || weatherCode.includes('266')) icon = '🌧️';
                else if (weatherCode.includes('182') || weatherCode.includes('185')) icon = '🌨️';
                else if (weatherCode.includes('200')) icon = '⛈️';
                
                document.getElementById('weatherIcon').textContent = icon;
            } catch (e) {
                document.getElementById('weatherTemp').textContent = '7°C';
                document.getElementById('weatherHumidity').textContent = '75%';
                document.getElementById('weatherWind').textContent = '12 km/h';
            }
        }
        
        function refreshWeather() {
            const icon = document.getElementById('weatherIcon');
            icon.style.opacity = '0.5';
            fetchWeather();
            setTimeout(() => icon.style.opacity = '1', 300);
        }
        
        function getWeatherIcon() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return '🌤️';
            if (hour >= 12 && hour < 18) return '☀️';
            if (hour >= 18 && hour < 22) return '🌙';
            return '🌙';
        }
        
        document.getElementById('weatherIcon').textContent = getWeatherIcon();
        fetchWeather();
