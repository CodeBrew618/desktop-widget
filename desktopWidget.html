<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Jarvis's Workshop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0f2847 100%);
            --bg-widget: rgba(255,255,255,0.05);
            --text-primary: #fff;
            --text-secondary: #888;
            --text-accent: #00d9ff;
            --accent-green: #00ff88;
            --accent-yellow: #ffd93d;
            --accent-red: #ff6b6b;
            --accent-purple: #a855f7;
            --border-color: rgba(255,255,255,0.1);
        }
        
        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 50%, #d0d5dc 100%);
            --bg-widget: rgba(255,255,255,0.85);
            --text-primary: #1a1a2e;
            --text-secondary: #666;
            --text-accent: #0284c7;
            --accent-green: #059669;
            --accent-yellow: #ca8a04;
            --accent-red: #dc2626;
            --accent-purple: #7c3aed;
            --border-color: rgba(0,0,0,0.1);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: all 0.3s;
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        
        .hero { text-align: center; padding: 30px 0; }
        .hero-subtitle { font-size: 1em; color: var(--accent-purple); margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
        h1 { font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(90deg, var(--text-accent), var(--accent-green), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .typing-text { font-size: 1.1em; color: var(--accent-green); min-height: 30px; }
        .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent-green); margin-left: 3px; animation: blink 1s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .hero-status { display: flex; gap: 15px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .status-badge { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-widget); border-radius: 15px; font-size: 0.85em; border: 1px solid var(--border-color); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); }
        
        .controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .control-btn { background: var(--bg-widget); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85em; transition: all 0.3s; }
        .control-btn:hover { background: rgba(255,255,255,0.1); }
        .control-btn.active { background: rgba(0,217,255,0.3); border-color: var(--text-accent); }
        
        .search-area { margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; }
        .search-input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 15px; color: var(--text-primary); font-size: 1em; }
        .search-input::placeholder { color: var(--text-secondary); }
        .search-btn { background: linear-gradient(135deg, var(--text-accent), var(--accent-purple)); border: none; color: #fff; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .widget { background: var(--bg-widget); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); }
        .widget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .widget-title { font-size: 1.1em; color: var(--text-accent); }
        .widget-btn { background: rgba(0,217,255,0.2); border: none; color: var(--text-accent); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85em; }
        
        .clock-display { text-align: center; font-size: 3em; font-family: 'Courier New', monospace; color: var(--accent-green); }
        .clock-date { text-align: center; color: var(--text-secondary); font-size: 1em; margin-top: 8px; }
        
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .weather-main { text-align: center; padding: 15px; background: rgba(255,217,61,0.1); border-radius: 12px; }
        .weather-icon { font-size: 2.5em; margin-bottom: 5px; }
        .weather-temp { font-size: 2em; color: var(--accent-yellow); }
        .weather-city { color: var(--text-secondary); font-size: 0.9em; margin-top: 3px; }
        .weather-info { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
        .weather-detail { background: rgba(0,217,255,0.1); padding: 10px; border-radius: 8px; text-align: center; }
        .weather-detail-value { font-size: 1.2em; color: var(--text-accent); }
        .weather-detail-label { font-size: 0.75em; color: var(--text-secondary); margin-top: 3px; }
        
        .news-section { grid-column: span 2; }
        .news-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .news-tab { background: rgba(255,255,255,0.1); border: none; color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em; }
        .news-tab.active { background: rgba(0,217,255,0.3); color: var(--text-primary); }
        .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .news-card { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; cursor: pointer; transition: all 0.2s; }
        .news-card:hover { background: rgba(255,255,255,0.1); }
        .news-card-title { font-size: 0.9em; color: var(--text-primary); line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .news-card-meta { display: flex; justify-content: space-between; font-size: 0.75em; color: var(--text-secondary); }
        .news-card-link { display: inline-block; margin-top: 8px; padding: 4px 8px; background: rgba(0,217,255,0.2); border-radius: 4px; font-size: 0.75em; color: var(--text-accent); }
        .news-refresh-btn { display: block; width: 100%; margin-top: 12px; padding: 10px; background: linear-gradient(135deg, var(--text-accent), var(--accent-green)); border: none; border-radius: 8px; color: #fff; font-size: 0.9em; font-weight: bold; cursor: pointer; }
        .news-loading { text-align: center; padding: 30px; color: var(--text-secondary); grid-column: span 3; }
        
        .todo-input-area { display: flex; gap: 8px; margin-bottom: 12px; }
        .todo-input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: var(--text-primary); font-size: 0.9em; }
        .todo-input::placeholder { color: var(--text-secondary); }
        .todo-add-btn { background: var(--accent-green); border: none; color: #1a1a2e; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .todo-list { max-height: 200px; overflow-y: auto; }
        .todo-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); gap: 8px; }
        .todo-text { flex: 1; color: var(--text-primary); font-size: 0.9em; }
        .todo-text.done { text-decoration: line-through; color: var(--text-secondary); }
        .todo-delete { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 1em; }
        
        .counter-section { text-align: center; }
        .big-counter { font-size: 3.5em; color: var(--accent-red); font-weight: bold; }
        .counter-controls { margin-top: 15px; }
        .counter-btn { background: rgba(255,107,107,0.2); border: none; color: var(--accent-red); padding: 8px 15px; border-radius: 8px; cursor: pointer; margin: 0 3px; }
        
        .status-bar { display: flex; justify-content: center; gap: 30px; padding: 15px; background: var(--bg-widget); border-radius: 12px; margin-top: 20px; border: 1px solid var(--border-color); }
        .status-item { text-align: center; }
        .status-value { font-size: 1.5em; color: var(--accent-green); }
        .status-label { font-size: 0.75em; color: var(--text-secondary); margin-top: 3px; }
        .pulse-dot { display: inline-block; width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; margin-left: 5px; }
        
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .news-section { grid-column: span 1; }
            .news-grid { grid-template-columns: 1fr; }
            .news-loading { grid-column: span 1; }
            h1 { font-size: 1.8em; }
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--text-accent); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <p class="hero-subtitle" data-i18n="subtitle">Powered by Jarvis AI</p>
            <h1>Welcome to Jarvis's Workshop</h1>
            <div class="typing-text"><span id="typing"></span><span class="cursor"></span></div>
            <div class="hero-status">
                <div class="status-badge"><span class="status-dot"></span><span data-i18n="status1">System Online</span></div>
                <div class="status-badge"><span class="status-dot"></span><span>MiniMax M2.7</span></div>
                <div class="status-badge"><span class="status-dot"></span><span data-i18n="status2">OpenClaw Ready</span></div>
            </div>
        </div>
        
        <div class="header">
            <div class="controls">
                <button class="control-btn active" data-lang="en" onclick="setLang('en')">EN</button>
                <button class="control-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
                <button class="control-btn" onclick="setTheme('dark')">Dark</button>
                <button class="control-btn" onclick="setTheme('light')">Light</button>
            </div>
        </div>
        
        <div class="search-area">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search anything..." onkeypress="if(event.key==='Enter') openSearch()">
                <button class="search-btn" onclick="openSearch()" data-i18n="search">Search</button>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title" data-i18n="clock">Clock</span>
                </div>
                <div class="clock-display" id="clock">00:00:00</div>
                <div class="clock-date" id="date">2026-03-19</div>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title" data-i18n="weather">Weather</span>
                    <button class="widget-btn" onclick="refreshWeather()" data-i18n="refresh">Refresh</button>
                </div>
                <div class="weather-grid">
                    <div class="weather-main">
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-temp" id="weatherTemp">--°C</div>
                        <div class="weather-city">Saskatoon</div>
                    </div>
                    <div class="weather-info">
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherHumidity">--%</div>
                            <div class="weather-detail-label" data-i18n="humidity">Humidity</div>
                        </div>
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherWind">-- km/h</div>
                            <div class="weather-detail-label" data-i18n="wind">Wind</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="widget news-section">
                <div class="widget-header">
                    <span class="widget-title" data-i18n="news">Latest News</span>
                    <div class="news-tabs">
                        <button class="news-tab active" data-i18n="world" onclick="switchNewsTab('world')">World</button>
                        <button class="news-tab" data-i18n="china" onclick="switchNewsTab('china')">China</button>
                        <button class="news-tab" data-i18n="tech" onclick="switchNewsTab('tech')">Tech</button>
                    </div>
                </div>
                <div class="news-grid" id="newsGrid"><div class="news-loading">Loading...</div></div>
                <button class="news-refresh-btn" onclick="loadNews()" data-i18n="refreshNews">Refresh News</button>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title" data-i18n="todo">Todo List</span>
                </div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="todoInput" data-i18n-placeholder="addTaskPlaceholder" placeholder="Add new task..." onkeypress="if(event.key==='Enter') addTodo()">
                    <button class="todo-add-btn" onclick="addTodo()" data-i18n="add">Add</button>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title" data-i18n="counter">Counter</span>
                    <button class="widget-btn" onclick="resetCounter()" data-i18n="reset">Reset</button>
                </div>
                <div class="counter-section">
                    <div class="big-counter" id="bigCounter">0</div>
                    <div class="counter-controls">
                        <button class="counter-btn" onclick="changeCounter(-10)">-10</button>
                        <button class="counter-btn" onclick="changeCounter(-1)">-1</button>
                        <button class="counter-btn" onclick="changeCounter(1)">+1</button>
                        <button class="counter-btn" onclick="changeCounter(10)">+10</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="uptime">0:00:00<span class="pulse-dot"></span></div>
                <div class="status-label" data-i18n="uptime">Uptime</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="fps">60</div>
                <div class="status-label">FPS</div>
            </div>
            <div class="status-item">
                <div class="status-value">1</div>
                <div class="status-label" data-i18n="visitors">Visitors</div>
            </div>
        </div>
    </div>
    
    <script>
        // Translations
        const i18n = {
            en: {
                subtitle: 'Powered by Jarvis AI',
                status1: 'System Online',
                status2: 'OpenClaw Ready',
                search: 'Search',
                searchPlaceholder: 'Search anything...',
                clock: 'Clock',
                weather: 'Weather',
                refresh: 'Refresh',
                humidity: 'Humidity',
                wind: 'Wind',
                news: 'Latest News',
                world: 'World',
                china: 'China',
                tech: 'Tech',
                refreshNews: 'Refresh News',
                todo: 'Todo List',
                addTaskPlaceholder: 'Add new task...',
                add: 'Add',
                counter: 'Counter',
                reset: 'Reset',
                uptime: 'Uptime',
                visitors: 'Visitors',
                noTasks: 'No tasks yet'
            },
            zh: {
                subtitle: 'Jarvis AI 驱动',
                status1: '系统在线',
                status2: 'OpenClaw 就绪',
                search: '搜索',
                searchPlaceholder: '搜索任何内容...',
                clock: '时钟',
                weather: '天气',
                refresh: '刷新',
                humidity: '湿度',
                wind: '风速',
                news: '最新新闻',
                world: '世界',
                china: '中国',
                tech: '科技',
                refreshNews: '换一批',
                todo: '待办事项',
                addTaskPlaceholder: '添加新任务...',
                add: '添加',
                counter: '计数器',
                reset: '重置',
                uptime: '运行时间',
                visitors: '在线用户',
                noTasks: '暂无待办'
            }
        };
        
        let currentLang = localStorage.getItem('jarvisLang') || 'en';
        
        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('jarvisLang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
            document.querySelectorAll('.control-btn[data-lang]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
            loadNews();
            renderTodos();
        }
        
        // Theme
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('jarvisTheme', theme);
        }
        setTheme(localStorage.getItem('jarvisTheme') || 'dark');
        
        // Typing
        const phrases = { en: ["Hello, I'm Jarvis!", "Your AI assistant", "How can I help?", "Ready 24/7"], zh: ["你好，我是 Jarvis!", "你的 AI 助手", "有什么需要帮忙的?", "24小时待命"] };
        let phraseIndex = 0, charIndex = 0, isDeleting = false;
        
        function typeEffect() {
            const el = document.getElementById('typing');
            const current = phrases[currentLang][phraseIndex];
            if (isDeleting) { el.textContent = current.substring(0, charIndex - 1); charIndex--; }
            else { el.textContent = current.substring(0, charIndex + 1); charIndex++; }
            let speed = isDeleting ? 30 : 80;
            if (!isDeleting && charIndex === current.length) { speed = 2000; isDeleting = true; }
            else if (isDeleting && charIndex === 0) { isDeleting = false; phraseIndex = (phraseIndex + 1) % phrases[currentLang].length; speed = 500; }
            setTimeout(typeEffect, speed);
        }
        typeEffect();
        
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', {hour12: false});
            document.getElementById('date').textContent = now.toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US');
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // Weather
        async function fetchWeather() {
            try {
                const response = await fetch('https://wttr.in/Saskatoon?format=j1');
                const data = await response.json();
                const c = data.current_condition[0];
                document.getElementById('weatherTemp').textContent = c.temp_C + '°C';
                document.getElementById('weatherHumidity').textContent = c.humidity + '%';
                document.getElementById('weatherWind').textContent = c.windspeedKmph + ' km/h';
            } catch (e) {
                document.getElementById('weatherTemp').textContent = '7°C';
                document.getElementById('weatherHumidity').textContent = '75%';
                document.getElementById('weatherWind').textContent = '12 km/h';
            }
        }
        fetchWeather();
        function refreshWeather() { fetchWeather(); }
        
        // News
        const NEWS_DATA = {
            world: [
                { title: 'G7 leaders hold emergency meeting on Middle East tensions', source: 'BBC', link: 'https://www.bbc.com/news/world' },
                { title: 'Iran nuclear talks resume, diplomatic solutions sought', source: 'Reuters', link: 'https://www.reuters.com/world' },
                { title: 'Global energy markets volatile as oil prices surge', source: 'Bloomberg', link: 'https://www.bloomberg.com/markets' },
                { title: 'UN Chief calls for restraint amid regional tensions', source: 'UN News', link: 'https://news.un.org' },
                { title: 'Qatar LNG facility damage affects global energy supply', source: 'Al Jazeera', link: 'https://www.aljazeera.com' },
                { title: 'IMF lowers global growth forecast amid uncertainty', source: 'IMF', link: 'https://www.imf.org' }
            ],
            china: [
                { title: 'NPC session concludes, economic targets set for 2026', source: 'Xinhua', link: 'http://www.xinhuanet.com' },
                { title: 'China releases Q1 foreign trade data, stable growth', source: 'People Daily', link: 'http://www.people.com.cn' },
                { title: 'Boao Forum opens, focusing on openness and cooperation', source: 'CCTV', link: 'https://news.cctv.com' },
                { title: 'China signs new trade agreements with multiple countries', source: 'China Daily', link: 'http://www.chinadaily.com.cn' },
                { title: 'Chinese tech innovation continues to advance', source: 'Sci Tech Daily', link: 'http://digitalpaper.stdaily.com' },
                { title: 'Greater Bay Area makes new progress', source: 'Nanfang Daily', link: 'http://www.nfdaily.cn' }
            ],
            tech: [
                { title: 'AI models achieve breakthroughs in multiple fields', source: 'TechCrunch', link: 'https://techcrunch.com' },
                { title: 'Global chip shortage gradually eases', source: 'Wired', link: 'https://www.wired.com' },
                { title: 'Quantum computing takes major step toward practicality', source: 'MIT Tech', link: 'https://www.technologyreview.com' },
                { title: 'EV sales continue to grow, market share expands', source: 'The Verge', link: 'https://www.theverge.com' },
                { title: 'Cybersecurity threats increase, companies strengthen defenses', source: 'Ars Technica', link: 'https://arstechnica.com' },
                { title: '5G deployment accelerates, IoT applications boom', source: 'Engadget', link: 'https://www.engadget.com' }
            ]
        };
        
        let currentTab = 'world';
        
        function loadNews() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '<div class="news-loading">Loading...</div>';
            setTimeout(() => {
                const shuffled = [...NEWS_DATA[currentTab]].sort(() => Math.random() - 0.5);
                grid.innerHTML = shuffled.map(news => `
                    <div class="news-card" onclick="window.open('${news.link}', '_blank')">
                        <div class="news-card-title">${news.title}</div>
                        <div class="news-card-meta"><span>${news.source}</span><span>Just now</span></div>
                    </div>
                `).join('');
            }, 300);
        }
        
        function switchNewsTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.news-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadNews();
        }
        loadNews();
        
        // Todo
        let todos = JSON.parse(localStorage.getItem('jarvisTodos') || '[]');
        
        function renderTodos() {
            const list = document.getElementById('todoList');
            if (todos.length === 0) {
                list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:0.9em;">${i18n[currentLang].noTasks}</div>`;
                return;
            }
            list.innerHTML = todos.map((t, i) => `
                <div class="todo-item">
                    <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${i})">
                    <span class="todo-text ${t.done ? 'done' : ''}">${t.text}</span>
                    <button class="todo-delete" onclick="deleteTodo(${i})">x</button>
                </div>
            `).join('');
        }
        
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text) { todos.push({ text, done: false }); localStorage.setItem('jarvisTodos', JSON.stringify(todos)); renderTodos(); input.value = ''; }
        }
        
        function toggleTodo(i) { todos[i].done = !todos[i].done; localStorage.setItem('jarvisTodos', JSON.stringify(todos)); renderTodos(); }
        function deleteTodo(i) { todos.splice(i, 1); localStorage.setItem('jarvisTodos', JSON.stringify(todos)); renderTodos(); }
        renderTodos();
        
        // Counter
        let counter = 0;
        function updateCounter() { document.getElementById('bigCounter').textContent = counter.toLocaleString(); }
        function changeCounter(delta) { counter += delta; updateCounter(); }
        function resetCounter() { counter = 0; updateCounter(); }
        
        // Search
        function openSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
        }
        
        // Uptime
        const startTime = Date.now();
        setInterval(() => {
            const e = Date.now() - startTime;
            const s = Math.floor(e / 1000) % 60;
            const m = Math.floor(e / 60000) % 60;
            const h = Math.floor(e / 3600000);
            document.getElementById('uptime').innerHTML = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}<span class="pulse-dot"></span>`;
        }, 1000);
        
        // FPS
        let frames = 0, lastTime = performance.now();
        function calculateFPS() {
            frames++;
            if (performance.now() - lastTime >= 1000) { document.getElementById('fps').textContent = frames; frames = 0; lastTime = performance.now(); }
            requestAnimationFrame(calculateFPS);
        }
        calculateFPS();
        
        // Init
        setLang(currentLang);
    </script>
</body>
</html>
