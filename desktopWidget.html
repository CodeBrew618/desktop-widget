<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Jarvis's Workshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0f2847 100%);
            --bg-widget: rgba(255,255,255,0.05);
            --bg-widget-hover: rgba(255,255,255,0.08);
            --text-primary: #fff;
            --text-secondary: #888;
            --text-accent: #00d9ff;
            --accent-green: #00ff88;
            --accent-yellow: #ffd93d;
            --accent-red: #ff6b6b;
            --accent-purple: #a855f7;
            --border-color: rgba(255,255,255,0.1);
        }
        
        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 50%, #d0d5dc 100%);
            --bg-widget: rgba(255,255,255,0.85);
            --bg-widget-hover: rgba(255,255,255,0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #666;
            --text-accent: #0284c7;
            --accent-green: #059669;
            --accent-yellow: #ca8a04;
            --accent-red: #dc2626;
            --accent-purple: #7c3aed;
            --border-color: rgba(0,0,0,0.1);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: all 0.3s;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.3;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }
        
        .hero {
            text-align: center;
            padding: 40px 0;
        }
        
        .hero-subtitle {
            font-size: 1.2em;
            color: var(--accent-purple);
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 15px;
            background: linear-gradient(90deg, var(--text-accent), var(--accent-green), var(--accent-purple));
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .typing-text {
            font-size: 1.3em;
            color: var(--accent-green);
            margin-top: 15px;
            min-height: 40px;
        }
        
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: var(--accent-green);
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .hero-status {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-widget);
            border-radius: 20px;
            font-size: 0.9em;
            border: 1px solid var(--border-color);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0,255,136,0); }
        }
        
        .theme-toggle {
            display: flex;
            gap: 10px;
        }
        
        .theme-btn {
            background: var(--bg-widget);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .theme-btn:hover {
            transform: scale(1.1);
        }
        
        .search-area {
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            color: var(--text-primary);
            font-size: 1em;
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        .search-btn {
            background: linear-gradient(135deg, var(--text-accent), var(--accent-purple));
            border: none;
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .widget {
            background: var(--bg-widget);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        
        .widget:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .widget-title {
            font-size: 1.3em;
            color: var(--text-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .widget-icon {
            font-size: 1.5em;
        }
        
        .widget-btn {
            background: rgba(0,217,255,0.2);
            border: none;
            color: var(--text-accent);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .widget-btn:hover {
            transform: scale(1.05);
        }
        
        .clock-display {
            text-align: center;
            font-size: 4em;
            font-family: 'Courier New', monospace;
            color: var(--accent-green);
            text-shadow: 0 0 30px var(--accent-green);
        }
        
        .clock-date {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2em;
            margin-top: 10px;
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .weather-main {
            text-align: center;
            padding: 20px;
            background: rgba(255,217,61,0.1);
            border-radius: 15px;
        }
        
        .weather-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .weather-temp {
            font-size: 3em;
            color: var(--accent-yellow);
        }
        
        .weather-city {
            color: var(--text-secondary);
            font-size: 1.1em;
            margin-top: 5px;
        }
        
        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }
        
        .weather-detail {
            background: rgba(0,217,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .weather-detail-value {
            font-size: 1.5em;
            color: var(--text-accent);
        }
        
        .weather-detail-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .news-section {
            grid-column: span 2;
        }
        
        .news-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .news-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .news-tab.active {
            background: rgba(0,217,255,0.3);
            color: var(--text-primary);
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .news-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .news-card:hover {
            border-color: var(--text-accent);
            transform: translateY(-3px);
        }
        
        .news-card-title {
            font-size: 0.95em;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .news-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .news-card-source {
            font-size: 0.75em;
            color: var(--text-accent);
        }
        
        .news-card-time {
            font-size: 0.75em;
            color: var(--text-secondary);
        }
        
        .news-card-link {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(0,217,255,0.2);
            border-radius: 6px;
            font-size: 0.8em;
            color: var(--text-accent);
        }
        
        .news-refresh-btn {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(135deg, var(--text-accent), var(--accent-green));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }
        
        .news-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            grid-column: span 3;
        }
        
        .todo-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .todo-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 1em;
        }
        
        .todo-input::placeholder {
            color: var(--text-secondary);
        }
        
        .todo-add-btn {
            background: var(--accent-green);
            border: none;
            color: #1a1a2e;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .todo-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }
        
        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .todo-text {
            flex: 1;
            color: var(--text-primary);
        }
        
        .todo-text.done {
            text-decoration: line-through;
            color: var(--text-secondary);
        }
        
        .todo-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 1.2em;
        }
        
        .counter-section {
            text-align: center;
        }
        
        .big-counter {
            font-size: 5em;
            color: var(--accent-red);
            font-weight: bold;
        }
        
        .counter-controls {
            margin-top: 20px;
        }
        
        .counter-btn {
            background: rgba(255,107,107,0.2);
            border: none;
            color: var(--accent-red);
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s;
        }
        
        .counter-btn:hover {
            transform: scale(1.1);
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: var(--bg-widget);
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-value {
            font-size: 1.8em;
            color: var(--accent-green);
        }
        
        .status-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .news-section { grid-column: span 1; }
            .news-grid { grid-template-columns: 1fr; }
            .news-loading { grid-column: span 1; }
            .header { flex-direction: column; gap: 15px; }
            h1 { font-size: 2em; }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--text-accent); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="hero">
            <p class="hero-subtitle">Powered by Jarvis AI</p>
            <h1>Welcome to Jarvis's Workshop</h1>
            <div class="typing-text">
                <span id="typing"></span><span class="cursor"></span>
            </div>
            <div class="hero-status">
                <div class="status-badge"><span class="status-dot"></span><span>System Online</span></div>
                <div class="status-badge"><span class="status-dot"></span><span>MiniMax M2.7</span></div>
                <div class="status-badge"><span class="status-dot"></span><span>OpenClaw Ready</span></div>
            </div>
        </div>
        
        <div class="header">
            <div></div>
            <div class="theme-toggle">
                <button class="theme-btn" onclick="setTheme('dark')" title="Dark">Dark</button>
                <button class="theme-btn" onclick="setTheme('light')" title="Light">Light</button>
            </div>
        </div>
        
        <div class="search-area">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Search anything..." onkeypress="if(event.key==='Enter') openSearch()">
                <button class="search-btn" onclick="openSearch()">Search</button>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">🕐</span> Clock</span>
                </div>
                <div class="clock-display" id="clock">00:00:00</div>
                <div class="clock-date" id="date">2026-03-19</div>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">🌤️</span> Weather</span>
                    <button class="widget-btn" onclick="refreshWeather()">Refresh</button>
                </div>
                <div class="weather-grid">
                    <div class="weather-main">
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-temp" id="weatherTemp">--°C</div>
                        <div class="weather-city">Saskatoon</div>
                    </div>
                    <div class="weather-info">
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherHumidity">--%</div>
                            <div class="weather-detail-label">Humidity</div>
                        </div>
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherWind">-- km/h</div>
                            <div class="weather-detail-label">Wind</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="widget news-section">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">📰</span> Latest News</span>
                    <div>
                        <button class="widget-btn" onclick="switchNewsTab('world')">World</button>
                        <button class="widget-btn" onclick="switchNewsTab('china')">China</button>
                        <button class="widget-btn" onclick="switchNewsTab('tech')">Tech</button>
                    </div>
                </div>
                <div class="news-grid" id="newsGrid">
                    <div class="news-loading">Loading...</div>
                </div>
                <button class="news-refresh-btn" onclick="loadNews()">Refresh News</button>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">✅</span> Todo List</span>
                </div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="todoInput" placeholder="Add new task..." onkeypress="if(event.key==='Enter') addTodo()">
                    <button class="todo-add-btn" onclick="addTodo()">Add</button>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title"><span class="widget-icon">🔢</span> Counter</span>
                    <button class="widget-btn" onclick="resetCounter()">Reset</button>
                </div>
                <div class="counter-section">
                    <div class="big-counter" id="bigCounter">0</div>
                    <div class="counter-controls">
                        <button class="counter-btn" onclick="changeCounter(-10)">-10</button>
                        <button class="counter-btn" onclick="changeCounter(-1)">-1</button>
                        <button class="counter-btn" onclick="changeCounter(1)">+1</button>
                        <button class="counter-btn" onclick="changeCounter(10)">+10</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="uptime">0:00:00<span class="pulse-dot"></span></div>
                <div class="status-label">Uptime</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="fps">60</div>
                <div class="status-label">FPS</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="visitors">1</div>
                <div class="status-label">Visitors</div>
            </div>
        </div>
    </div>
    
    <script>
        // Particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 10 + 10) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(p);
            }
        }
        createParticles();
        
        // Typing effect
        const phrases = ["Hello, I'm Jarvis!", "Your AI assistant", "How can I help?", "Ready 24/7", "Let's build something!"];
        let phraseIndex = 0, charIndex = 0, isDeleting = false;
        
        function typeEffect() {
            const el = document.getElementById('typing');
            const current = phrases[phraseIndex];
            if (isDeleting) {
                el.textContent = current.substring(0, charIndex - 1);
                charIndex--;
            } else {
                el.textContent = current.substring(0, charIndex + 1);
                charIndex++;
            }
            let speed = isDeleting ? 50 : 100;
            if (!isDeleting && charIndex === current.length) {
                speed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                speed = 500;
            }
            setTimeout(typeEffect, speed);
        }
        typeEffect();
        
        // Theme
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('jarvisTheme', theme);
        }
        const savedTheme = localStorage.getItem('jarvisTheme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', {hour12: false});
            document.getElementById('date').textContent = now.toLocaleDateString('en-US');
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // Weather
        async function fetchWeather() {
            try {
                const response = await fetch('https://wttr.in/Saskatoon?format=j1');
                const data = await response.json();
                const c = data.current_condition[0];
                document.getElementById('weatherTemp').textContent = c.temp_C + '°C';
                document.getElementById('weatherHumidity').textContent = c.humidity + '%';
                document.getElementById('weatherWind').textContent = c.windspeedKmph + ' km/h';
                const code = c.weatherCode;
                let icon = '☀️';
                if (code.includes('119') || code.includes('122')) icon = '☁️';
                else if (code.includes('176') || code.includes('263')) icon = '🌧️';
                else if (code.includes('200')) icon = '⛈️';
                document.getElementById('weatherIcon').textContent = icon;
            } catch (e) {
                document.getElementById('weatherTemp').textContent = '7°C';
                document.getElementById('weatherHumidity').textContent = '75%';
                document.getElementById('weatherWind').textContent = '12 km/h';
            }
        }
        fetchWeather();
        
        function refreshWeather() {
            document.getElementById('weatherIcon').style.opacity = '0.5';
            fetchWeather();
            setTimeout(() => document.getElementById('weatherIcon').style.opacity = '1', 300);
        }
        
        // News
        const NEWS_DATA = {
            world: [
                { title: 'G7 leaders hold emergency meeting on Middle East tensions', source: 'BBC', link: 'https://www.bbc.com/news/world' },
                { title: 'Iran nuclear talks resume, diplomatic solutions sought', source: 'Reuters', link: 'https://www.reuters.com/world' },
                { title: 'Global energy markets volatile as oil prices surge', source: 'Bloomberg', link: 'https://www.bloomberg.com/markets' },
                { title: 'UN Chief calls for restraint amid regional tensions', source: 'UN News', link: 'https://news.un.org' },
                { title: 'Qatar LNG facility damage affects global energy supply', source: 'Al Jazeera', link: 'https://www.aljazeera.com' },
                { title: 'IMF lowers global growth forecast amid uncertainty', source: 'IMF', link: 'https://www.imf.org' }
            ],
            china: [
                { title: 'NPC session concludes, economic targets set for 2026', source: 'Xinhua', link: 'http://www.xinhuanet.com' },
                { title: 'China releases Q1 foreign trade data, stable growth', source: 'People Daily', link: 'http://www.people.com.cn' },
                { title: 'Boao Forum opens, focusing on openness and cooperation', source: 'CCTV', link: 'https://news.cctv.com' },
                { title: 'China signs new trade agreements with multiple countries', source: 'China Daily', link: 'http://www.chinadaily.com.cn' },
                { title: 'Chinese tech innovation continues to advance', source: 'Sci Tech Daily', link: 'http://digitalpaper.stdaily.com' },
                { title: 'Guangdong-HK-Macao Greater Bay Area makes new progress', source: 'Nanfang Daily', link: 'http://www.nfdaily.cn' }
            ],
            tech: [
                { title: 'AI models achieve breakthroughs in multiple fields', source: 'TechCrunch', link: 'https://techcrunch.com' },
                { title: 'Global chip shortage gradually eases, production recovers', source: 'Wired', link: 'https://www.wired.com' },
                { title: 'Quantum computing takes major step toward practicality', source: 'MIT Tech', link: 'https://www.technologyreview.com' },
                { title: 'EV sales continue to grow, market share expands', source: 'The Verge', link: 'https://www.theverge.com' },
                { title: 'Cybersecurity threats increase, companies strengthen defenses', source: 'Ars Technica', link: 'https://arstechnica.com' },
                { title: '5G deployment accelerates, IoT applications boom', source: 'Engadget', link: 'https://www.engadget.com' }
            ]
        };
        
        let currentTab = 'world';
        
        function loadNews() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '<div class="news-loading">Loading...</div>';
            setTimeout(() => {
                const shuffled = [...NEWS_DATA[currentTab]].sort(() => Math.random() - 0.5);
                grid.innerHTML = shuffled.map(news => `
                    <div class="news-card" onclick="window.open('${news.link}', '_blank')">
                        <div class="news-card-title">${news.title}</div>
                        <div class="news-card-meta">
                            <span class="news-card-source">${news.source}</span>
                            <span class="news-card-time">Just now</span>
                        </div>
                        <span class="news-card-link">Read more →</span>
                    </div>
                `).join('');
            }, 500);
        }
        
        function switchNewsTab(tab) {
            currentTab = tab;
            loadNews();
        }
        loadNews();
        
        // Todo
        let todos = JSON.parse(localStorage.getItem('jarvisTodos') || '[]');
        
        function renderTodos() {
            const list = document.getElementById('todoList');
            if (todos.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">No tasks yet</div>';
                return;
            }
            list.innerHTML = todos.map((t, i) => `
                <div class="todo-item">
                    <input type="checkbox" class="todo-checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${i})">
                    <span class="todo-text ${t.done ? 'done' : ''}">${t.text}</span>
                    <button class="todo-delete" onclick="deleteTodo(${i})">×</button>
                </div>
            `).join('');
        }
        
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text) {
                todos.push({ text, done: false });
                localStorage.setItem('jarvisTodos', JSON.stringify(todos));
                renderTodos();
                input.value = '';
            }
        }
        
        function toggleTodo(i) {
            todos[i].done = !todos[i].done;
            localStorage.setItem('jarvisTodos', JSON.stringify(todos));
            renderTodos();
        }
        
        function deleteTodo(i) {
            todos.splice(i, 1);
            localStorage.setItem('jarvisTodos', JSON.stringify(todos));
            renderTodos();
        }
        renderTodos();
        
        // Counter
        let counter = 0;
        function updateCounter() { document.getElementById('bigCounter').textContent = counter.toLocaleString(); }
        function changeCounter(delta) { counter += delta; updateCounter(); }
        function resetCounter() { counter = 0; updateCounter(); }
        
        // Search
        function openSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
        }
        
        // Uptime
        const startTime = Date.now();
        setInterval(() => {
            const e = Date.now() - startTime;
            const s = Math.floor(e / 1000) % 60;
            const m = Math.floor(e / 60000) % 60;
            const h = Math.floor(e / 3600000);
            document.getElementById('uptime').innerHTML = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}<span class="pulse-dot"></span>`;
        }, 1000);
        
        // FPS
        let frames = 0, lastTime = performance.now();
        function calculateFPS() {
            frames++;
            if (performance.now() - lastTime >= 1000) {
                document.getElementById('fps').textContent = frames;
                frames = 0;
                lastTime = performance.now();
            }
            requestAnimationFrame(calculateFPS);
        }
        calculateFPS();
    </script>
</body>
</html>
