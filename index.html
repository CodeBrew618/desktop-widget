<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis M2.7 工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .widget {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .widget-title {
            font-size: 1.3em;
            color: #00d9ff;
        }
        
        .widget-btn {
            background: rgba(0,217,255,0.2);
            border: none;
            color: #00d9ff;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .widget-btn:hover {
            background: rgba(0,217,255,0.4);
        }
        
        /* 时钟 */
        .clock-display {
            text-align: center;
            font-size: 4em;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            text-shadow: 0 0 30px #00ff88;
        }
        
        .clock-date {
            text-align: center;
            color: #888;
            font-size: 1.2em;
            margin-top: 10px;
        }
        
        /* 天气 - 使用静态示例 */
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .weather-main {
            text-align: center;
            padding: 20px;
            background: rgba(255,217,61,0.1);
            border-radius: 15px;
        }
        
        .weather-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .weather-temp {
            font-size: 3em;
            color: #ffd93d;
        }
        
        .weather-city {
            color: #888;
            font-size: 1.1em;
            margin-top: 5px;
        }
        
        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }
        
        .weather-detail {
            background: rgba(0,217,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .weather-detail-value {
            font-size: 1.5em;
            color: #00d9ff;
        }
        
        .weather-detail-label {
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
        }
        
        /* 新闻 */
        .news-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .news-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #888;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .news-tab.active {
            background: rgba(0,217,255,0.3);
            color: #fff;
        }
        
        .news-list {
            max-height: 350px;
            overflow-y: auto;
        }
        
        .news-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .news-item:hover {
            background: rgba(0,217,255,0.1);
        }
        
        .news-title {
            font-size: 0.95em;
            color: #fff;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        
        .news-meta {
            font-size: 0.8em;
            color: #666;
        }
        
        .news-loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        /* 待办 */
        .todo-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .todo-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 1em;
        }
        
        .todo-input::placeholder {
            color: #666;
        }
        
        .todo-add-btn {
            background: #00ff88;
            border: none;
            color: #1a1a2e;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .todo-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            gap: 10px;
        }
        
        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .todo-text {
            flex: 1;
            color: #fff;
        }
        
        .todo-text.done {
            text-decoration: line-through;
            color: #666;
        }
        
        .todo-delete {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 1.2em;
        }
        
        /* 快捷搜索 */
        .search-area {
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 1em;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            color: #1a1a2e;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* 计数器 */
        .counter-section {
            text-align: center;
        }
        
        .big-counter {
            font-size: 5em;
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .counter-controls {
            margin-top: 20px;
        }
        
        .counter-btn {
            background: rgba(255,107,107,0.2);
            border: none;
            color: #ff6b6b;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s;
        }
        
        .counter-btn:hover {
            background: rgba(255,107,107,0.4);
        }
        
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-value {
            font-size: 1.8em;
            color: #00ff88;
        }
        
        .status-label {
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
        }
        
        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .weather-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0,217,255,0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Jarvis 工具箱</h1>
        <p class="subtitle">实用小工具 · 实时数据</p>
        
        <div class="search-area">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="输入搜索内容..." onkeypress="if(event.key==='Enter') openSearch()">
                <button class="search-btn" onclick="openSearch()">🔍 搜索</button>
            </div>
        </div>
        
        <div class="main-grid">
            <!-- 时钟 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🕐 时钟</span>
                </div>
                <div class="clock-display" id="clock">00:00:00</div>
                <div class="clock-date" id="date">2026年3月19日 星期四</div>
            </div>
            
            <!-- 天气 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🌤️ 天气</span>
                    <button class="widget-btn" onclick="refreshWeather()">刷新</button>
                </div>
                <div class="weather-grid" id="weatherGrid">
                    <div class="weather-main">
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-temp" id="weatherTemp">7°C</div>
                        <div class="weather-city">Saskatoon</div>
                    </div>
                    <div class="weather-info">
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherHumidity">75%</div>
                            <div class="weather-detail-label">湿度</div>
                        </div>
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherWind">12 km/h</div>
                            <div class="weather-detail-label">风速</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 新闻 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">📰 最新新闻</span>
                    <button class="widget-btn" onclick="refreshNews()">刷新</button>
                </div>
                <div class="news-tabs">
                    <button class="news-tab active" onclick="switchNewsTab('world')">世界</button>
                    <button class="news-tab" onclick="switchNewsTab('china')">中国</button>
                    <button class="news-tab" onclick="switchNewsTab('tech')">科技</button>
                </div>
                <div class="news-list" id="newsList">
                    <div class="news-loading">加载中...</div>
                </div>
            </div>
            
            <!-- 待办 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">✅ 待办事项</span>
                </div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="todoInput" placeholder="添加新任务..." onkeypress="if(event.key==='Enter') addTodo()">
                    <button class="todo-add-btn" onclick="addTodo()">添加</button>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>
        </div>
        
        <!-- 计数器 -->
        <div class="widget">
            <div class="widget-header">
                <span class="widget-title">🔢 计数器</span>
                <button class="widget-btn" onclick="resetCounter()">重置</button>
            </div>
            <div class="counter-section">
                <div class="big-counter" id="bigCounter">0</div>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="changeCounter(-10)">-10</button>
                    <button class="counter-btn" onclick="changeCounter(-1)">-1</button>
                    <button class="counter-btn" onclick="changeCounter(1)">+1</button>
                    <button class="counter-btn" onclick="changeCounter(10)">+10</button>
                </div>
            </div>
        </div>
        
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="uptime">0:00:00<span class="pulse-dot"></span></div>
                <div class="status-label">运行时间</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="fps">60</div>
                <div class="status-label">FPS</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="visitors">1</div>
                <div class="status-label">在线用户</div>
            </div>
        </div>
    </div>
    
    <script>
        // ===== 时钟 =====
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', {hour12: false});
            document.getElementById('clock').textContent = time;
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('zh-CN', options);
            document.getElementById('date').textContent = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // ===== 天气 - 使用嵌入数据 =====
        const weatherData = {
            saskatoon: {
                temp: '7°C',
                icon: '🌤️',
                humidity: '75%',
                wind: '12 km/h',
                condition: '多云'
            }
        };
        
        function refreshWeather() {
            // 模拟刷新动画
            const icon = document.getElementById('weatherIcon');
            icon.style.opacity = '0.5';
            setTimeout(() => {
                icon.style.opacity = '1';
            }, 300);
        }
        
        function getWeatherIcon() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return '🌤️';
            if (hour >= 12 && hour < 18) return '☀️';
            if (hour >= 18 && hour < 22) return '🌙';
            return '🌙';
        }
        
        document.getElementById('weatherIcon').textContent = getWeatherIcon();
        
        // ===== 新闻 - 使用静态示例数据 =====
        const newsData = {
            world: [
                { title: '伊朗局势持续紧张，G7呼吁各方保持克制', time: '2小时前', source: 'BBC中文' },
                { title: '加拿大承诺向霍尔木兹海峡争议地区提供援助', time: '3小时前', source: 'CTV News' },
                { title: '全球市场因中东局势动荡大幅下跌', time: '4小时前', source: 'CBC' },
                { title: '特朗普与日本首相会面，讨论贸易协议', time: '5小时前', source: 'Reuters' },
                { title: '卡塔尔LNG设施受损，全球能源市场受影响', time: '6小时前', source: 'Bloomberg' },
                { title: '联合国安理会召开紧急会议讨论中东局势', time: '7小时前', source: 'CNN' },
            ],
            china: [
                { title: '两会闭幕，各项政策决议获通过', time: '1小时前', source: '新华网' },
                { title: '中国发布一季度经济数据，总体运行平稳', time: '2小时前', source: '人民网' },
                { title: '中国在国际贸易谈判中取得新进展', time: '3小时前', source: '央视新闻' },
                { title: '多地推出促进消费新举措', time: '4小时前', source: '中国日报' },
                { title: '科技创新成为今年发展重点方向', time: '5小时前', source: '中新社' },
            ],
            tech: [
                { title: 'AI模型发现22个Firefox浏览器安全漏洞', time: '1小时前', source: 'InfoQ' },
                { title: 'QCon London: 摩根士丹利重新规划MCP时代的API项目', time: '2小时前', source: 'InfoQ' },
                { title: '近40%加拿大青少年屏幕时间超标', time: '3小时前', source: 'Global News' },
                { title: 'MiniMax发布M2.7新版本模型', time: '5小时前', source: '官方公告' },
                { title: 'OpenClaw更新至2026.3.13版本', time: '6小时前', source: '官方公告' },
            ]
        };
        
        let currentNewsTab = 'world';
        
        function switchNewsTab(tab) {
            currentNewsTab = tab;
            document.querySelectorAll('.news-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderNews();
        }
        
        function renderNews() {
            const newsList = document.getElementById('newsList');
            const news = newsData[currentNewsTab];
            newsList.innerHTML = news.map(n => `
                <div class="news-item">
                    <div class="news-title">${n.title}</div>
                    <div class="news-meta">${n.source} · ${n.time}</div>
                </div>
            `).join('');
        }
        
        function refreshNews() {
            const newsList = document.getElementById('newsList');
            newsList.innerHTML = '<div class="news-loading">刷新中...</div>';
            setTimeout(renderNews, 500);
        }
        
        renderNews();
        
        // ===== 待办 =====
        let todos = JSON.parse(localStorage.getItem('jarvisTodos') || '[]');
        
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            if (todos.length === 0) {
                todoList.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">暂无待办事项</div>';
                return;
            }
            todoList.innerHTML = todos.map((todo, i) => `
                <div class="todo-item">
                    <input type="checkbox" class="todo-checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${i})">
                    <span class="todo-text ${todo.done ? 'done' : ''}">${todo.text}</span>
                    <button class="todo-delete" onclick="deleteTodo(${i})">×</button>
                </div>
            `).join('');
        }
        
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text) {
                todos.push({ text, done: false });
                saveTodos();
                renderTodos();
                input.value = '';
            }
        }
        
        function toggleTodo(i) {
            todos[i].done = !todos[i].done;
            saveTodos();
            renderTodos();
        }
        
        function deleteTodo(i) {
            todos.splice(i, 1);
            saveTodos();
            renderTodos();
        }
        
        function saveTodos() {
            localStorage.setItem('jarvisTodos', JSON.stringify(todos));
        }
        renderTodos();
        
        // ===== 计数器 =====
        let counter = 0;
        
        function updateCounter() {
            document.getElementById('bigCounter').textContent = counter.toLocaleString();
        }
        
        function changeCounter(delta) {
            counter += delta;
            updateCounter();
        }
        
        function resetCounter() {
            counter = 0;
            updateCounter();
        }
        
        // ===== 搜索 =====
        function openSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
        }
        
        // ===== 运行时间 =====
        const startTime = Date.now();
        function updateUptime() {
            const elapsed = Date.now() - startTime;
            const seconds = Math.floor(elapsed / 1000) % 60;
            const minutes = Math.floor(elapsed / 60000) % 60;
            const hours = Math.floor(elapsed / 3600000);
            document.getElementById('uptime').innerHTML = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}<span class="pulse-dot"></span>`;
        }
        setInterval(updateUptime, 1000);
        
        // ===== FPS =====
        let frames = 0;
        let lastTime = performance.now();
        function calculateFPS() {
            frames++;
            if (performance.now() - lastTime >= 1000) {
                document.getElementById('fps').textContent = frames;
                frames = 0;
                lastTime = performance.now();
            }
            requestAnimationFrame(calculateFPS);
        }
        calculateFPS();
    </script>
</body>
</html>
