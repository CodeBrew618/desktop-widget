<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis M2.7 工具箱</title>
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --bg-widget: rgba(255,255,255,0.05);
            --bg-widget-hover: rgba(255,255,255,0.08);
            --text-primary: #fff;
            --text-secondary: #888;
            --text-accent: #00d9ff;
            --accent-green: #00ff88;
            --accent-yellow: #ffd93d;
            --accent-red: #ff6b6b;
            --border-color: rgba(255,255,255,0.1);
            --card-bg: rgba(255,255,255,0.05);
            --input-bg: rgba(255,255,255,0.1);
            --shadow: rgba(0,0,0,0.3);
        }
        
        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 50%, #d0d5dc 100%);
            --bg-widget: rgba(255,255,255,0.8);
            --bg-widget-hover: rgba(255,255,255,0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #666;
            --text-accent: #0077cc;
            --accent-green: #00aa55;
            --accent-yellow: #cc9900;
            --accent-red: #cc4444;
            --border-color: rgba(0,0,0,0.1);
            --card-bg: rgba(255,255,255,0.9);
            --input-bg: rgba(255,255,255,0.9);
            --shadow: rgba(0,0,0,0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--text-accent), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s;
        }
        
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .theme-btn {
            background: var(--bg-widget);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .theme-btn:hover {
            background: var(--bg-widget-hover);
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .widget {
            background: var(--bg-widget);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        
        .widget:hover {
            background: var(--bg-widget-hover);
        }
        
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .widget-title {
            font-size: 1.3em;
            color: var(--text-accent);
            transition: color 0.3s;
        }
        
        .widget-btn {
            background: rgba(0,217,255,0.2);
            border: none;
            color: var(--text-accent);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        [data-theme="light"] .widget-btn {
            background: rgba(0,119,204,0.15);
            color: var(--text-accent);
        }
        
        .widget-btn:hover {
            opacity: 0.8;
        }
        
        .clock-display {
            text-align: center;
            font-size: 4em;
            font-family: 'Courier New', monospace;
            color: var(--accent-green);
            text-shadow: 0 0 30px var(--accent-green);
            transition: all 0.3s;
        }
        
        .clock-date {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2em;
            margin-top: 10px;
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .weather-main {
            text-align: center;
            padding: 20px;
            background: rgba(255,217,61,0.1);
            border-radius: 15px;
            transition: background 0.3s;
        }
        
        [data-theme="light"] .weather-main {
            background: rgba(255,217,61,0.15);
        }
        
        .weather-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .weather-temp {
            font-size: 3em;
            color: var(--accent-yellow);
            transition: color 0.3s;
        }
        
        .weather-city {
            color: var(--text-secondary);
            font-size: 1.1em;
            margin-top: 5px;
        }
        
        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }
        
        .weather-detail {
            background: rgba(0,217,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
        }
        
        [data-theme="light"] .weather-detail {
            background: rgba(0,119,204,0.1);
        }
        
        .weather-detail-value {
            font-size: 1.5em;
            color: var(--text-accent);
        }
        
        .weather-detail-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .news-section {
            grid-column: span 2;
        }
        
        .news-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .news-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        [data-theme="light"] .news-tab {
            background: rgba(0,0,0,0.05);
        }
        
        .news-tab.active {
            background: rgba(0,217,255,0.3);
            color: var(--text-primary);
        }
        
        [data-theme="light"] .news-tab.active {
            background: rgba(0,119,204,0.25);
            color: var(--text-primary);
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .news-card:hover {
            background: var(--bg-widget-hover);
            border-color: var(--text-accent);
            transform: translateY(-2px);
        }
        
        .news-card-title {
            font-size: 0.95em;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .news-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .news-card-source {
            font-size: 0.75em;
            color: var(--text-accent);
        }
        
        .news-card-time {
            font-size: 0.75em;
            color: var(--text-secondary);
        }
        
        .news-card-link {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(0,217,255,0.2);
            border-radius: 6px;
            font-size: 0.8em;
            color: var(--text-accent);
            text-decoration: none;
            transition: all 0.3s;
        }
        
        [data-theme="light"] .news-card-link {
            background: rgba(0,119,204,0.15);
        }
        
        .news-card:hover .news-card-link {
            background: rgba(0,217,255,0.4);
        }
        
        [data-theme="light"] .news-card:hover .news-card-link {
            background: rgba(0,119,204,0.3);
        }
        
        .news-refresh-btn {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(135deg, var(--text-accent), var(--accent-green));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .news-refresh-btn:hover {
            opacity: 0.9;
        }
        
        .news-refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .news-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            grid-column: span 3;
        }
        
        .todo-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .todo-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .todo-input::placeholder {
            color: var(--text-secondary);
        }
        
        .todo-add-btn {
            background: var(--accent-green);
            border: none;
            color: #1a1a2e;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .todo-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }
        
        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .todo-text {
            flex: 1;
            color: var(--text-primary);
        }
        
        .todo-text.done {
            text-decoration: line-through;
            color: var(--text-secondary);
        }
        
        .todo-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 1.2em;
        }
        
        .search-area {
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        .search-btn {
            background: linear-gradient(135deg, var(--text-accent), var(--accent-green));
            border: none;
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .counter-section {
            text-align: center;
        }
        
        .big-counter {
            font-size: 5em;
            color: var(--accent-red);
            font-weight: bold;
            transition: color 0.3s;
        }
        
        .counter-controls {
            margin-top: 20px;
        }
        
        .counter-btn {
            background: rgba(255,107,107,0.2);
            border: none;
            color: var(--accent-red);
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s;
        }
        
        [data-theme="light"] .counter-btn {
            background: rgba(204,68,68,0.15);
        }
        
        .counter-btn:hover {
            opacity: 0.8;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: var(--bg-widget);
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-value {
            font-size: 1.8em;
            color: var(--accent-green);
            transition: color 0.3s;
        }
        
        .status-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .weather-grid {
                grid-template-columns: 1fr;
            }
            .news-section {
                grid-column: span 1;
            }
            .news-grid {
                grid-template-columns: 1fr;
            }
            .news-loading {
                grid-column: span 1;
            }
            .header {
                flex-direction: column;
                gap: 15px;
            }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--text-accent);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🤖 Jarvis M2.7 工具箱</h1>
                <p class="subtitle">实用小工具 · 实时数据</p>
            </div>
            <div class="theme-toggle">
                <button class="theme-btn" onclick="setTheme('dark')" title="深色模式">🌙</button>
                <button class="theme-btn" onclick="setTheme('light')" title="浅色模式">☀️</button>
            </div>
        </div>
        
        <div class="search-area">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="输入搜索内容..." onkeypress="if(event.key==='Enter') openSearch()">
                <button class="search-btn" onclick="openSearch()">🔍 搜索</button>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🕐 时钟</span>
                </div>
                <div class="clock-display" id="clock">00:00:00</div>
                <div class="clock-date" id="date">2026年3月19日 星期四</div>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🌤️ 天气</span>
                    <button class="widget-btn" onclick="refreshWeather()">刷新</button>
                </div>
                <div class="weather-grid">
                    <div class="weather-main">
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-temp" id="weatherTemp">7°C</div>
                        <div class="weather-city">Saskatoon</div>
                    </div>
                    <div class="weather-info">
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherHumidity">--</div>
                            <div class="weather-detail-label">湿度</div>
                        </div>
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherWind">--</div>
                            <div class="weather-detail-label">风速</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="widget news-section">
                <div class="widget-header">
                    <span class="widget-title">📰 最新新闻</span>
                    <div>
                        <button class="widget-btn" onclick="switchNewsTab('world')">世界</button>
                        <button class="widget-btn" onclick="switchNewsTab('china')">中国</button>
                        <button class="widget-btn" onclick="switchNewsTab('tech')">科技</button>
                    </div>
                </div>
                <div class="news-grid" id="newsGrid">
                    <div class="news-loading">加载中...</div>
                </div>
                <button class="news-refresh-btn" id="refreshBtn" onclick="loadNews()">🔄 换一批</button>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">✅ 待办事项</span>
                </div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="todoInput" placeholder="添加新任务..." onkeypress="if(event.key==='Enter') addTodo()">
                    <button class="todo-add-btn" onclick="addTodo()">添加</button>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>
            
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🔢 计数器</span>
                    <button class="widget-btn" onclick="resetCounter()">重置</button>
                </div>
                <div class="counter-section">
                    <div class="big-counter" id="bigCounter">0</div>
                    <div class="counter-controls">
                        <button class="counter-btn" onclick="changeCounter(-10)">-10</button>
                        <button class="counter-btn" onclick="changeCounter(-1)">-1</button>
                        <button class="counter-btn" onclick="changeCounter(1)">+1</button>
                        <button class="counter-btn" onclick="changeCounter(10)">+10</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="uptime">0:00:00<span class="pulse-dot"></span></div>
                <div class="status-label">运行时间</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="fps">60</div>
                <div class="status-label">FPS</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="visitors">1</div>
                <div class="status-label">在线用户</div>
            </div>
        </div>
    </div>
    
    <script>
        // ===== 主题切换 =====
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('jarvisTheme', theme);
        }
        
        function loadTheme() {
            const savedTheme = localStorage.getItem('jarvisTheme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
        }
        loadTheme();
        
        // ===== 时钟 =====
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', {hour12: false});
            document.getElementById('clock').textContent = time;
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('zh-CN', options);
            document.getElementById('date').textContent = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // ===== 天气 =====
        async function fetchWeather() {
            try {
                const response = await fetch('https://wttr.in/Saskatoon?format=j1');
                const data = await response.json();
                const current = data.current_condition[0];
                
                document.getElementById('weatherTemp').textContent = current.temp_C + '°C';
                document.getElementById('weatherHumidity').textContent = current.humidity + '%';
                document.getElementById('weatherWind').textContent = current.windspeedKmph + ' km/h';
                
                const weatherCode = current.weatherCode;
                let icon = '☀️';
                if (weatherCode.includes('119') || weatherCode.includes('122')) icon = '☁️';
                else if (weatherCode.includes('143') || weatherCode.includes('248')) icon = '🌫️';
                else if (weatherCode.includes('176') || weatherCode.includes('263') || weatherCode.includes('266')) icon = '🌧️';
                else if (weatherCode.includes('182') || weatherCode.includes('185')) icon = '🌨️';
                else if (weatherCode.includes('200')) icon = '⛈️';
                
                document.getElementById('weatherIcon').textContent = icon;
            } catch (e) {
                document.getElementById('weatherTemp').textContent = '7°C';
                document.getElementById('weatherHumidity').textContent = '75%';
                document.getElementById('weatherWind').textContent = '12 km/h';
            }
        }
        
        function refreshWeather() {
            const icon = document.getElementById('weatherIcon');
            icon.style.opacity = '0.5';
            fetchWeather();
            setTimeout(() => icon.style.opacity = '1', 300);
        }
        
        function getWeatherIcon() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return '🌤️';
            if (hour >= 12 && hour < 18) return '☀️';
            if (hour >= 18 && hour < 22) return '🌙';
            return '🌙';
        }
        
        document.getElementById('weatherIcon').textContent = getWeatherIcon();
        fetchWeather();
        
        // ===== 新闻 =====
        const NEWS_DATA = {
            world: [
                { title: 'G7领导人召开紧急会议讨论中东局势，呼吁各方保持克制', source: 'BBC News', link: 'https://www.bbc.com/news/world' },
                { title: '伊朗核协议谈判重启，各方寻求外交解决方案', source: 'Reuters', link: 'https://www.reuters.com/world' },
                { title: '全球能源市场持续波动，油价创下年内新高', source: 'Bloomberg', link: 'https://www.bloomberg.com/markets' },
                { title: '联合国秘书长发表声明，呼吁避免地区冲突升级', source: 'UN News', link: 'https://news.un.org' },
                { title: '欧洲多国呼吁霍尔木兹海峡航行自由', source: 'Al Jazeera', link: 'https://www.aljazeera.com' },
                { title: '国际货币基金组织下调全球经济增长预期', source: 'IMF', link: 'https://www.imf.org' },
            ],
            china: [
                { title: '两会闭幕，全年经济社会发展目标确定', source: '新华网', link: 'http://www.xinhuanet.com' },
                { title: '中国发布一季度外贸数据，总体保持稳定增长', source: '人民网', link: 'http://www.people.com.cn' },
                { title: '博鳌亚洲论坛开幕，聚焦开放与合作', source: '央视新闻', link: 'https://news.cctv.com' },
                { title: '中国与多国签署新的贸易合作协议', source: '中国日报', link: 'http://www.chinadaily.com.cn' },
                { title: '中国科技创新能力持续提升，多项技术获突破', source: '科技日报', link: 'http://digitalpaper.stdaily.com' },
                { title: '粤港澳大湾区建设取得新进展', source: '南方日报', link: 'http://www.nfdaily.cn' },
            ],
            tech: [
                { title: '人工智能模型在多领域取得突破性进展', source: 'TechCrunch', link: 'https://techcrunch.com' },
                { title: '全球芯片短缺问题逐渐缓解，产能持续恢复', source: 'Wired', link: 'https://www.wired.com' },
                { title: '量子计算实用化迈出重要一步', source: 'MIT Tech Review', link: 'https://www.technologyreview.com' },
                { title: '新能源汽车销量持续增长，市场份额不断扩大', source: 'The Verge', link: 'https://www.theverge.com' },
                { title: '网络安全威胁加剧，企业加强防护措施', source: 'Ars Technica', link: 'https://arstechnica.com' },
                { title: '5G网络部署加速，物联网应用迎来爆发期', source: 'Engadget', link: 'https://www.engadget.com' },
            ]
        };
        
        let currentNewsTab = 'world';
        let shuffledNews = [];
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function loadNews() {
            const newsGrid = document.getElementById('newsGrid');
            const refreshBtn = document.getElementById('refreshBtn');
            
            newsGrid.innerHTML = '<div class="news-loading">加载中...</div>';
            refreshBtn.disabled = true;
            
            setTimeout(() => {
                shuffledNews = shuffleArray(NEWS_DATA[currentNewsTab]);
                
                newsGrid.innerHTML = shuffledNews.map(news => `
                    <div class="news-card" onclick="window.open('${news.link}', '_blank')">
                        <div class="news-card-title">${news.title}</div>
                        <div class="news-card-meta">
                            <span class="news-card-source">${news.source}</span>
                            <span class="news-card-time">刚刚</span>
                        </div>
                        <span class="news-card-link">阅读原文 →</span>
                    </div>
                `).join('');
                
                refreshBtn.disabled = false;
            }, 500);
        }
        
        function switchNewsTab(tab) {
            currentNewsTab = tab;
            loadNews();
        }
        
        // ===== 待办 =====
        let todos = JSON.parse(localStorage.getItem('jarvisTodos') || '[]');
        
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            if (todos.length === 0) {
                todoList.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">暂无待办事项</div>';
                return;
            }
            todoList.innerHTML = todos.map((todo, i) => `
                <div class="todo-item">
                    <input type="checkbox" class="todo-checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${i})">
                    <span class="todo-text ${todo.done ? 'done' : ''}">${todo.text}</span>
                    <button class="todo-delete" onclick="deleteTodo(${i})">×</button>
                </div>
            `).join('');
        }
        
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text) {
                todos.push({ text, done: false });
                saveTodos();
                renderTodos();
                input.value = '';
            }
        }
        
        function toggleTodo(i) {
            todos[i].done = !todos[i].done;
            saveTodos();
            renderTodos();
        }
        
        function deleteTodo(i) {
            todos.splice(i, 1);
            saveTodos();
            renderTodos();
        }
        
        function saveTodos() {
            localStorage.setItem('jarvisTodos', JSON.stringify(todos));
        }
        renderTodos();
        
        // ===== 计数器 =====
        let counter = 0;
        
        function updateCounter() {
            document.getElementById('bigCounter').textContent = counter.toLocaleString();
        }
        
        function changeCounter(delta) {
            counter += delta;
            updateCounter();
        }
        
        function resetCounter() {
            counter = 0;
            updateCounter();
        }
        
        // ===== 搜索 =====
        function openSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
        }
        
        // ===== 运行时间 =====
        const startTime = Date.now();
        function updateUptime() {
            const elapsed = Date.now() - startTime;
            const seconds = Math.floor(elapsed / 1000) % 60;
            const minutes = Math.floor(elapsed / 60000) % 60;
            const hours = Math.floor(elapsed / 3600000);
            document.getElementById('uptime').innerHTML = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}<span class="pulse-dot"></span>`;
        }
        setInterval(updateUptime, 1000);
        
        // ===== FPS =====
        let frames = 0;
        let lastTime = performance.now();
        function calculateFPS() {
            frames++;
            if (performance.now() - lastTime >= 1000) {
                document.getElementById('fps').textContent = frames;
                frames = 0;
                lastTime = performance.now();
            }
            requestAnimationFrame(calculateFPS);
        }
        calculateFPS();
        
        // ===== 初始化 =====
        loadNews();
    </script>
</body>
</html>
