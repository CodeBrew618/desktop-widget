<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis M2.7 工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .widget {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .widget-title {
            font-size: 1.3em;
            color: #00d9ff;
        }
        
        .widget-btn {
            background: rgba(0,217,255,0.2);
            border: none;
            color: #00d9ff;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .widget-btn:hover {
            background: rgba(0,217,255,0.4);
        }
        
        /* 时钟 */
        .clock-display {
            text-align: center;
            font-size: 4em;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            text-shadow: 0 0 30px #00ff88;
        }
        
        .clock-date {
            text-align: center;
            color: #888;
            font-size: 1.2em;
            margin-top: 10px;
        }
        
        /* 天气 */
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .weather-main {
            text-align: center;
            padding: 20px;
            background: rgba(255,217,61,0.1);
            border-radius: 15px;
        }
        
        .weather-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .weather-temp {
            font-size: 3em;
            color: #ffd93d;
        }
        
        .weather-city {
            color: #888;
            font-size: 1.1em;
            margin-top: 5px;
        }
        
        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }
        
        .weather-detail {
            background: rgba(0,217,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .weather-detail-value {
            font-size: 1.5em;
            color: #00d9ff;
        }
        
        .weather-detail-label {
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
        }
        
        /* 新闻 */
        .news-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .news-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #888;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .news-tab.active {
            background: rgba(0,217,255,0.3);
            color: #fff;
        }
        
        .news-list {
            max-height: 350px;
            overflow-y: auto;
        }
        
        .news-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .news-item:hover {
            background: rgba(0,217,255,0.1);
        }
        
        .news-title {
            font-size: 0.95em;
            color: #fff;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        
        .news-meta {
            font-size: 0.8em;
            color: #666;
        }
        
        .news-loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .news-refresh-btn {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .news-refresh-btn:hover {
            opacity: 0.9;
        }
        
        .news-refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 待办 */
        .todo-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .todo-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 1em;
        }
        
        .todo-input::placeholder {
            color: #666;
        }
        
        .todo-add-btn {
            background: #00ff88;
            border: none;
            color: #1a1a2e;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .todo-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            gap: 10px;
        }
        
        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .todo-text {
            flex: 1;
            color: #fff;
        }
        
        .todo-text.done {
            text-decoration: line-through;
            color: #666;
        }
        
        .todo-delete {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 1.2em;
        }
        
        /* 快捷搜索 */
        .search-area {
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 1em;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            color: #1a1a2e;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* 计数器 */
        .counter-section {
            text-align: center;
        }
        
        .big-counter {
            font-size: 5em;
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .counter-controls {
            margin-top: 20px;
        }
        
        .counter-btn {
            background: rgba(255,107,107,0.2);
            border: none;
            color: #ff6b6b;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s;
        }
        
        .counter-btn:hover {
            background: rgba(255,107,107,0.4);
        }
        
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-value {
            font-size: 1.8em;
            color: #00ff88;
        }
        
        .status-label {
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
        }
        
        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .weather-grid {
                grid-template-columns: 1fr;
            }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0,217,255,0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Jarvis M2.7 工具箱</h1>
        <p class="subtitle">实用小工具 · 实时数据</p>
        
        <div class="search-area">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="输入搜索内容..." onkeypress="if(event.key==='Enter') openSearch()">
                <button class="search-btn" onclick="openSearch()">🔍 搜索</button>
            </div>
        </div>
        
        <div class="main-grid">
            <!-- 时钟 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🕐 时钟</span>
                </div>
                <div class="clock-display" id="clock">00:00:00</div>
                <div class="clock-date" id="date">2026年3月19日 星期四</div>
            </div>
            
            <!-- 天气 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🌤️ 天气</span>
                    <button class="widget-btn" onclick="refreshWeather()">刷新</button>
                </div>
                <div class="weather-grid" id="weatherGrid">
                    <div class="weather-main">
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-temp" id="weatherTemp">7°C</div>
                        <div class="weather-city">Saskatoon</div>
                    </div>
                    <div class="weather-info">
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherHumidity">75%</div>
                            <div class="weather-detail-label">湿度</div>
                        </div>
                        <div class="weather-detail">
                            <div class="weather-detail-value" id="weatherWind">12 km/h</div>
                            <div class="weather-detail-label">风速</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 新闻 -->
            <div class="widget" style="grid-column: span 2;">
                <div class="widget-header">
                    <span class="widget-title">📰 最新新闻</span>
                    <button class="widget-btn" onclick="switchNewsTab('world')">世界</button>
                    <button class="widget-btn" onclick="switchNewsTab('china')">中国</button>
                    <button class="widget-btn" onclick="switchNewsTab('tech')">科技</button>
                </div>
                <div class="news-list" id="newsList">
                    <div class="news-loading">加载中...</div>
                </div>
                <button class="news-refresh-btn" id="refreshBtn" onclick="refreshNews()">🔄 换一批</button>
            </div>
            
            <!-- 待办 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">✅ 待办事项</span>
                </div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="todoInput" placeholder="添加新任务..." onkeypress="if(event.key==='Enter') addTodo()">
                    <button class="todo-add-btn" onclick="addTodo()">添加</button>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>
            
            <!-- 计数器 -->
            <div class="widget">
                <div class="widget-header">
                    <span class="widget-title">🔢 计数器</span>
                    <button class="widget-btn" onclick="resetCounter()">重置</button>
                </div>
                <div class="counter-section">
                    <div class="big-counter" id="bigCounter">0</div>
                    <div class="counter-controls">
                        <button class="counter-btn" onclick="changeCounter(-10)">-10</button>
                        <button class="counter-btn" onclick="changeCounter(-1)">-1</button>
                        <button class="counter-btn" onclick="changeCounter(1)">+1</button>
                        <button class="counter-btn" onclick="changeCounter(10)">+10</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="uptime">0:00:00<span class="pulse-dot"></span></div>
                <div class="status-label">运行时间</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="fps">60</div>
                <div class="status-label">FPS</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="visitors">1</div>
                <div class="status-label">在线用户</div>
            </div>
        </div>
    </div>
    
    <script>
        // ===== 时钟 =====
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', {hour12: false});
            document.getElementById('clock').textContent = time;
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('zh-CN', options);
            document.getElementById('date').textContent = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // ===== 天气 =====
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        
        async function fetchWeather() {
            try {
                const response = await fetch(CORS_PROXY + encodeURIComponent('https://wttr.in/Saskatoon?format=j1'));
                const data = await response.json();
                const current = data.current_condition[0];
                
                document.getElementById('weatherTemp').textContent = current.temp_C + '°C';
                document.getElementById('weatherHumidity').textContent = current.humidity + '%';
                document.getElementById('weatherWind').textContent = current.windspeedKmph + ' km/h';
                
                const weatherCode = current.weatherCode;
                let icon = '☀️';
                if (weatherCode.includes('119') || weatherCode.includes('122')) icon = '☁️';
                else if (weatherCode.includes('143') || weatherCode.includes('248')) icon = '🌫️';
                else if (weatherCode.includes('176') || weatherCode.includes('263') || weatherCode.includes('266')) icon = '🌧️';
                else if (weatherCode.includes('182') || weatherCode.includes('185')) icon = '🌨️';
                else if (weatherCode.includes('200')) icon = '⛈️';
                
                document.getElementById('weatherIcon').textContent = icon;
            } catch (e) {
                console.log('Weather fetch failed:', e);
            }
        }
        
        function refreshWeather() {
            const icon = document.getElementById('weatherIcon');
            icon.style.opacity = '0.5';
            fetchWeather();
            setTimeout(() => icon.style.opacity = '1', 300);
        }
        
        function getWeatherIcon() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return '🌤️';
            if (hour >= 12 && hour < 18) return '☀️';
            if (hour >= 18 && hour < 22) return '🌙';
            return '🌙';
        }
        
        document.getElementById('weatherIcon').textContent = getWeatherIcon();
        fetchWeather();
        
        // ===== 新闻 =====
        const NEWS_FEEDS = {
            world: 'https://feeds.bbci.co.uk/news/world/rss.xml',
            china: 'https://feeds.bbci.co.uk/news/world/asia/rss.xml',
            tech: 'https://feeds.bbci.co.uk/news/technology/rss.xml'
        };
        
        let currentNewsTab = 'world';
        let currentStartIndex = 0;
        const NEWS_PER_PAGE = 6;
        
        async function fetchNews(topic) {
            const newsList = document.getElementById('newsList');
            const refreshBtn = document.getElementById('refreshBtn');
            
            newsList.innerHTML = '<div class="news-loading">加载中...</div>';
            refreshBtn.disabled = true;
            
            try {
                const response = await fetch(CORS_PROXY + encodeURIComponent(NEWS_FEEDS[topic]));
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = xml.querySelectorAll('item');
                
                const allNews = [];
                items.forEach(item => {
                    const title = item.querySelector('title')?.textContent || '';
                    const link = item.querySelector('link')?.textContent || '';
                    const pubDate = item.querySelector('pubDate')?.textContent;
                    let timeAgo = '';
                    if (pubDate) {
                        const date = new Date(pubDate);
                        timeAgo = getTimeAgo(date);
                    }
                    if (title && title.trim()) {
                        allNews.push({ title, link, timeAgo });
                    }
                });
                
                // 随机选择起始位置
                currentStartIndex = Math.floor(Math.random() * (allNews.length - NEWS_PER_PAGE));
                const news = allNews.slice(currentStartIndex, currentStartIndex + NEWS_PER_PAGE);
                
                if (news.length === 0) {
                    newsList.innerHTML = '<div class="news-loading">暂无新闻</div>';
                    return;
                }
                
                newsList.innerHTML = news.map(n => `
                    <div class="news-item" onclick="window.open('${n.link}', '_blank')">
                        <div class="news-title">${n.title}</div>
                        <div class="news-meta">${n.timeAgo || 'BBC News'}</div>
                    </div>
                `).join('');
                
            } catch (e) {
                console.log('News fetch failed:', e);
                newsList.innerHTML = '<div class="news-loading">加载失败，请点击"换一批"重试</div>';
            } finally {
                refreshBtn.disabled = false;
            }
        }
        
        function getTimeAgo(date) {
            if (isNaN(date.getTime())) return '';
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 3600) return Math.floor(seconds / 60) + '分钟前';
            if (seconds < 86400) return Math.floor(seconds / 3600) + '小时前';
            return Math.floor(seconds / 86400) + '天前';
        }
        
        function switchNewsTab(tab) {
            currentNewsTab = tab;
            document.querySelectorAll('.widget-btn').forEach(btn => {
                if (btn.textContent === '世界' || btn.textContent === '中国' || btn.textContent === '科技') {
                    btn.classList.remove('active');
                }
            });
            fetchNews(tab);
        }
        
        function refreshNews() {
            fetchNews(currentNewsTab);
        }
        
        // ===== 待办 =====
        let todos = JSON.parse(localStorage.getItem('jarvisTodos') || '[]');
        
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            if (todos.length === 0) {
                todoList.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">暂无待办事项</div>';
                return;
            }
            todoList.innerHTML = todos.map((todo, i) => `
                <div class="todo-item">
                    <input type="checkbox" class="todo-checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${i})">
                    <span class="todo-text ${todo.done ? 'done' : ''}">${todo.text}</span>
                    <button class="todo-delete" onclick="deleteTodo(${i})">×</button>
                </div>
            `).join('');
        }
        
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text) {
                todos.push({ text, done: false });
                saveTodos();
                renderTodos();
                input.value = '';
            }
        }
        
        function toggleTodo(i) {
            todos[i].done = !todos[i].done;
            saveTodos();
            renderTodos();
        }
        
        function deleteTodo(i) {
            todos.splice(i, 1);
            saveTodos();
            renderTodos();
        }
        
        function saveTodos() {
            localStorage.setItem('jarvisTodos', JSON.stringify(todos));
        }
        renderTodos();
        
        // ===== 计数器 =====
        let counter = 0;
        
        function updateCounter() {
            document.getElementById('bigCounter').textContent = counter.toLocaleString();
        }
        
        function changeCounter(delta) {
            counter += delta;
            updateCounter();
        }
        
        function resetCounter() {
            counter = 0;
            updateCounter();
        }
        
        // ===== 搜索 =====
        function openSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
        }
        
        // ===== 运行时间 =====
        const startTime = Date.now();
        function updateUptime() {
            const elapsed = Date.now() - startTime;
            const seconds = Math.floor(elapsed / 1000) % 60;
            const minutes = Math.floor(elapsed / 60000) % 60;
            const hours = Math.floor(elapsed / 3600000);
            document.getElementById('uptime').innerHTML = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}<span class="pulse-dot"></span>`;
        }
        setInterval(updateUptime, 1000);
        
        // ===== FPS =====
        let frames = 0;
        let lastTime = performance.now();
        function calculateFPS() {
            frames++;
            if (performance.now() - lastTime >= 1000) {
                document.getElementById('fps').textContent = frames;
                frames = 0;
                lastTime = performance.now();
            }
            requestAnimationFrame(calculateFPS);
        }
        calculateFPS();
        
        // ===== 初始化新闻 =====
        fetchNews('world');
    </script>
</body>
</html>
